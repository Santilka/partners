<section class="hero-slider" data-slider aria-roledescription="карусель" aria-label="Подборка">
  <div class="hero-slider-track">
    {% for slide in hero_slides %}
    <div class="hero-slide{% if slide.image %} has-image{% endif %}" data-slide>
      {% if slide.image %}
      <img class="hero-slide-bg" src="{{ slide.image.url }}" alt="{{ slide.alt }}" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
      {% endif %}
      <div class="hero-slide-overlay"></div>
      <div class="container hero-slide-inner">
        <div class="hero-slide-content">{{ slide.html|safe }}</div>
        {% if slide.link_url and slide.link_text %}
        <a class="btn btn-accent hero-slide-btn" href="{{ slide.link_url }}">{{ slide.link_text }}</a>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
  <button type="button" class="hero-slider-btn hero-slider-prev" aria-label="Назад">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button type="button" class="hero-slider-btn hero-slider-next" aria-label="Вперёд">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <div class="hero-slider-dots" role="tablist" aria-label="Слайды">
    {% for slide in hero_slides %}
    <button type="button" class="hero-slider-dot{% if forloop.first %} is-active{% endif %}" role="tab" aria-label="Слайд {{ forloop.counter }}" data-dot="{{ forloop.counter0 }}"></button>
    {% endfor %}
  </div>
</section>
